name: CI
on:
  push: {branches: [main, master]}
  pull_request:
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-python@v6
      with:
        python-version: '3.11'
        cache: pip
    - run: |
        sudo apt-get update
        sudo apt-get install -y build-essential gcc g++ cmake python3-dev portaudio19-dev libgl1 libglib2.0-0
    - run: |
        python -m pip install -U pip
        if [ -f requirements-ci.txt ]; then pip install -r requirements-ci.txt; else pip install -r requirements.txt; fi
    - run: pytest -v
    - run: docker build -t smart-traffic .
