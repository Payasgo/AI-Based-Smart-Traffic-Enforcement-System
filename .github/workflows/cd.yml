name: CD
on:
  push:
    branches: [main, master]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
    - run: |
        docker build -t ${{ secrets.DOCKER_USERNAME }}/smart-traffic:latest .
        docker push ${{ secrets.DOCKER_USERNAME }}/smart-traffic:latest
    - uses: appleboy/ssh-action@v1.2.0
      with:
        host: ${{ secrets.SERVER_IP }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        script: |
          docker pull ${{ secrets.DOCKER_USERNAME }}/smart-traffic:latest
          docker stop smart-traffic || true
          docker rm smart-traffic || true
          docker run -d --restart unless-stopped --name smart-traffic -p 5000:5000 ${{ secrets.DOCKER_USERNAME }}/smart-traffic:latest
