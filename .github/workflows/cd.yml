name: CD - Deploy to Local Windows Camera Host

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: local-windows-camera-deployment
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, windows, x64]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Validate local deployment environment
        shell: powershell
        run: |
          $python = Join-Path $env:GITHUB_WORKSPACE ".venv\Scripts\python.exe"
          if (-not (Test-Path $python)) { throw "Missing .venv. Follow docs/WINDOWS_LOCAL_DEPLOYMENT.md." }
          & $python -c "import cv2, numpy, scipy, ultralytics; print('Python runtime dependencies OK')"
          if ($LASTEXITCODE -ne 0) { throw "Python dependencies are not ready." }

      - name: Deploy camera application
        shell: powershell
        run: |
          & "$env:GITHUB_WORKSPACE\scripts\deploy-local-windows.ps1"
