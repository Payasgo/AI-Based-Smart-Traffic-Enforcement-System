<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2200" viewBox="0 0 1600 2200" role="img" aria-labelledby="title desc">
<title id="title">Complete roadside smart traffic enforcement hardware bill of materials</title>
<desc id="desc">Illustrated equipment board showing outdoor overview cameras, dedicated ANPR cameras, traffic signal camera, AI workstation, PoE switch, firewall, NAS storage, UPS, microphone, poles, weatherproof cabinet, fibre and cabling, surge protection and control room monitor.</desc>
