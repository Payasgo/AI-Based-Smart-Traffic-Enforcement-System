<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
<title id="title">Real-time roadside traffic enforcement hardware architecture</title>
<desc id="desc">Eight outdoor cameras connect through a managed PoE switch and 10 gigabit network to an AI inference workstation, evidence storage, operator dashboard and protected power.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#101c32"/><stop offset="1" stop-color="#1d3557"/></linearGradient><linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#203a5c"/><stop offset="1" stop-color="#172b45"/></linearGradient><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#59c3c3"/></marker><style>.h{font:700 34px Arial,sans-serif;fill:#fff}.sub{font:18px Arial,sans-serif;fill:#c9d8e9}.t{font:700 21px Arial,sans-serif;fill:#fff}.b{font:16px Arial,sans-serif;fill:#d8e6f3}.line{stroke:#59c3c3;stroke-width:4;fill:none;marker-end:url(#arrow)}.box{fill:url(#panel);stroke:#4f759b;stroke-width:2;rx:18}</style></defs>
<rect width="1400" height="900" fill="url(#bg)"/><text x="70" y="78" class="h">REAL-TIME ROADSIDE ENFORCEMENT</text><text x="70" y="113" class="sub">8-camera reference architecture • industrial capture • edge AI • protected evidence</text>
<rect x="70" y="160" width="1260" height="195" rx="22" fill="#14263e" stroke="#355779" stroke-width="2"/><text x="100" y="198" class="t">OUTDOOR CAMERA LAYER — 8 WIRED PoE CAMERAS</text>
